<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>제안전략 지식시스템 편집기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 좌측 폴더 트리 + 우측 레코드. 읽기와 편집을 한 화면에서 토글 */
:root{
  --bg:#f3f4f6; --panel:#fff; --sunk:#e9ebee; --rule:#d7dbe0;
  --ink:#15181c; --muted:#656c74; --faint:#8d949c;
  --accent:#0d6575; --accent-soft:#e2eff1;
  --warn:#8a5600; --warn-soft:#f6ecd9;
  --tmpl:#64548c; --tmpl-soft:#ece8f5;
  --ok:#2c6a4f; --ok-soft:#e2f0e9;
  --bad:#9a2f24; --bad-soft:#f8e6e3;
  --ui:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121519; --panel:#1a1e23; --sunk:#20252b; --rule:#2e343c;
  --ink:#e3e7ea; --muted:#939ba4; --faint:#747c85;
  --accent:#54b2c2; --accent-soft:#17323a;
  --warn:#d7a84a; --warn-soft:#30291a;
  --tmpl:#a898d4; --tmpl-soft:#262238;
  --ok:#73b894; --ok-soft:#18271f;
  --bad:#e08a7e; --bad-soft:#2e1d1a;
  color-scheme:dark;}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;
  line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

header.top{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;
  padding:.6rem 16px;border-bottom:1px solid var(--rule);background:var(--panel)}
h1{font-size:.95rem;font-weight:600;margin:0;white-space:nowrap}
.rootp{font-family:var(--mono);font-size:.7rem;color:var(--muted);overflow-wrap:anywhere}
#q{font-family:var(--ui);font-size:.82rem;color:var(--ink);background:var(--bg);
  border:1px solid var(--rule);border-radius:3px;padding:.36rem .55rem;flex:1 1 14rem;min-width:0}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tg{font-family:var(--ui);font-size:.74rem;color:var(--muted);background:var(--bg);
  border:1px solid var(--rule);border-radius:3px;padding:.36rem .55rem;cursor:pointer;white-space:nowrap}
.tg:hover{background:var(--sunk)}
.tg[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
#hits{font-family:var(--mono);font-size:.7rem;color:var(--muted);white-space:nowrap}

.cols{flex:1 1 auto;display:grid;grid-template-columns:16.25rem minmax(0,1fr);min-height:0}
@media (max-width:860px){.cols{grid-template-columns:1fr;grid-template-rows:14rem minmax(0,1fr)}}
nav.tree{overflow:auto;border-right:1px solid var(--rule);background:var(--panel);min-width:0}
@media (max-width:860px){nav.tree{border-right:0;border-bottom:1px solid var(--rule)}}
main.view{overflow:auto;padding:1.4rem 2rem 4rem;min-width:0}
@media (max-width:860px){main.view{padding:1rem 1.1rem 3rem}}

.cat{border-bottom:1px solid var(--rule)}
.cathead{display:flex;align-items:center;gap:.4rem;width:100%;text-align:left;cursor:pointer;
  font-family:var(--mono);font-size:.74rem;font-weight:500;color:var(--ink);
  background:var(--sunk);border:0;padding:.45rem .6rem}
.cathead:hover{color:var(--accent)}
.tw{width:.7rem;color:var(--faint)}
.cat[data-open="false"] .tw{transform:rotate(-90deg)}
.cathead .cn{margin-left:auto;font-size:.66rem;color:var(--muted)}
.cat[data-open="false"] .kids{display:none}
.rec{display:flex;align-items:baseline;gap:.4rem;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-left:2px solid transparent;
  padding:.3rem .6rem .3rem 1.4rem;color:var(--muted);font-family:var(--ui);font-size:.82rem;
  font-weight:400;line-height:1.45}
.rec:hover{background:var(--sunk)}
.rec:hover .nm{color:var(--ink)}
.rec[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent);
  font-weight:500;color:var(--ink)}
.rec .nm{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.rec .qn{font-family:var(--mono);font-size:.64rem;color:var(--warn);background:var(--warn-soft);
  border-radius:2px;padding:0 .24rem}
.rec .qn.z{color:var(--ok);background:transparent}
.rec.addrec .nm{color:var(--faint);font-family:var(--mono);font-size:.72rem}
.rec.addrec:hover .nm{color:var(--accent)}
.btn.del{color:var(--bad);border-color:var(--rule)}
.btn.del:hover{border-color:var(--bad);background:var(--sunk)}
.rec.tmpl .nm{color:var(--tmpl)}
.rec.tmpl .nm::after{content:"양식";font-family:var(--mono);font-size:.58rem;margin-left:.3rem;
  background:var(--tmpl-soft);color:var(--tmpl);padding:0 .2rem;border-radius:2px}
.rec.ex .nm::after{content:"기입례(가상)"}
.empty,.tfile{padding:.3rem .6rem .3rem 1.4rem;font-size:.72rem;color:var(--faint)}
.tfile{font-family:var(--mono);padding-left:2.2rem;overflow-wrap:anywhere}

.vhead{border-bottom:1px solid var(--rule);padding-bottom:.7rem;margin-bottom:1rem}
.vhead h2{font-size:1rem;font-weight:600;margin:0;overflow-wrap:anywhere}
.pathrow{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.4rem}
.pathrow code{font-family:var(--mono);font-size:.7rem;color:var(--muted);background:var(--sunk);
  padding:.16rem .4rem;border-radius:2px;overflow-wrap:anywhere;min-width:0}
.btn{font-family:var(--ui);font-size:.75rem;color:var(--muted);background:var(--panel);
  border:1px solid var(--rule);border-radius:3px;padding:.3rem .6rem;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sunk);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.go:hover:not(:disabled){background:var(--accent);filter:brightness(1.1);color:#fff}
.subs{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.sub{font-family:var(--mono);font-size:.66rem;border:1px solid var(--rule);border-radius:2px;
  padding:.12rem .4rem;color:var(--faint)}
.sub.has{color:var(--accent);border-color:var(--accent)}
.warnbar{margin-top:.5rem;font-size:.76rem;color:var(--warn)}
.warnbar b{font-family:var(--mono);font-weight:600}
.tmplbar{margin-top:.5rem;font-size:.78rem;color:var(--tmpl);background:var(--tmpl-soft);
  border-left:3px solid var(--tmpl);padding:.45rem .7rem}

/* 편집 */
.fields{display:grid;gap:.4rem;margin-bottom:.4rem}
.fld{display:grid;grid-template-columns:9.5rem minmax(0,1fr);gap:.5rem;align-items:start}
@media (max-width:620px){.fld{grid-template-columns:1fr;gap:.15rem}}
.fld label{font-family:var(--mono);font-size:.7rem;color:var(--muted);padding-top:.42rem;
  overflow-wrap:anywhere}
.fld textarea,.sec textarea{font-family:var(--ui);font-size:.84rem;line-height:1.55;color:var(--ink);
  background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:.38rem .5rem;
  width:100%;resize:vertical;min-width:0}
.fld textarea{min-height:2.3rem}
.fld textarea:focus,.sec textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.fld textarea.dirty,.sec textarea.dirty{border-color:var(--accent);background:var(--accent-soft)}
.sec{margin-bottom:1rem}
.sech{display:flex;align-items:baseline;gap:.5rem;font-family:var(--mono);font-size:.74rem;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);
  margin:1.3rem 0 .4rem;padding-bottom:.22rem;border-bottom:1px solid var(--rule)}
.sech .lock{font-size:.62rem;color:var(--faint);letter-spacing:0;text-transform:none;font-weight:400}
.sec textarea{min-height:7rem;font-family:var(--mono);font-size:.78rem;line-height:1.7}
.ro{white-space:pre-wrap;font-family:var(--mono);font-size:.78rem;line-height:1.7;
  background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:.5rem .6rem;
  overflow-x:auto}
.ro .q,.fld .q{background:var(--warn-soft);color:var(--warn);border-radius:2px;padding:0 .2em}
table.info{border-collapse:collapse;width:100%;font-size:.84rem}
table.info td{padding:.32rem .5rem;border-bottom:1px solid var(--rule);vertical-align:top}
table.info td:first-child{font-family:var(--mono);font-size:.72rem;color:var(--muted);
  white-space:nowrap;width:1%}

/* 읽기 화면 */
/* 글은 한 줄 48자쯤에서 끊는다. 창을 넓히면 1230px·98자까지 늘어나
   줄 끝에서 다음 줄 앞으로 눈이 돌아올 때 자리를 놓친다.
   표와 ``` 덩어리만 이 울타리 밖으로 내보낸다 — 6칸 표를 좁히면 못 읽는다. */
.doc{--read:45rem;font-size:1rem;line-height:1.75;overflow-wrap:break-word}
.doc > *{max-width:var(--read)}
.doc > .blk[data-wide], .doc > .blk[data-kind="code"],
.doc > .tblwrap.wide, .doc > pre{max-width:none}
.doc.wide > *{max-width:none}
.doc h1{display:none}
/* 제목이 본문보다 작으면 위계가 보이지 않는다. 긴 레코드를 훑을 수 있어야 한다 */
.doc h2{font-size:1.06rem;font-weight:600;color:var(--ink);margin:2rem 0 .55rem}
.doc h2:first-child{margin-top:0}
.doc h3{font-size:.94rem;font-weight:600;color:var(--muted);margin:1.2rem 0 .3rem}
.doc p{margin:.45rem 0}
.doc ul{margin:.35rem 0;padding-left:1.1rem}
.doc li{margin:.24rem 0}
/* 항목 아래 설명 줄. 위 `.sub`(배지)와 이름이 겹쳐 테두리·고정폭이 따라오던 것을 끊는다 */
.doc li .sub{color:var(--muted);font-size:.95em;margin:.12rem 0 .3rem;
  font-family:inherit;border:0;padding:0;border-radius:0}
.doc strong{font-weight:600}
.doc em{font-style:normal;color:var(--muted)}
.doc code{font-family:var(--mono);font-size:.85em;background:var(--sunk);padding:.08em .32em;
  border-radius:2px;overflow-wrap:anywhere}
/* 양식의 안내 주석 — 읽으라고 있는 것이라 흐리게만 보여 준다 */
.doc .note{margin:.6rem 0;padding:.5rem .7rem;border-left:2px dashed var(--rule);
  color:var(--faint);font-size:.78rem;line-height:1.75}
.doc pre{margin:.6rem 0;padding:.6rem .8rem;background:var(--sunk);border-radius:3px;
  overflow-x:auto;font-family:var(--mono);font-size:.76rem;line-height:1.55}
.doc pre code{background:none;padding:0;font-size:1em;white-space:pre}
.doc blockquote{margin:.6rem 0;padding:.5rem .8rem;background:var(--sunk);
  border-left:3px solid var(--rule);color:var(--muted);font-size:.85rem;border-radius:0 2px 2px 0}
.doc .q{background:var(--warn-soft);color:var(--warn);border-radius:2px;padding:0 .2em}
.tblwrap{overflow-x:auto;margin:.5rem 0;min-width:0}
.doc table{border-collapse:collapse;font-size:.82rem;min-width:100%}
.doc th,.doc td{text-align:left;padding:.36rem .6rem;border-bottom:1px solid var(--rule);
  vertical-align:top}
.doc thead th{font-family:var(--mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);font-weight:500;border-bottom:1px solid var(--ink)}
.doc tbody tr:last-child td{border-bottom:0}
.doc td:first-child{font-family:var(--mono);font-size:.76rem;color:var(--muted);white-space:nowrap}

/* 그 자리에서 고치기 */
.doc .blk{position:relative}
.doc.edit .blk.can{cursor:text;border-radius:3px;
  box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .1s,background .1s}
.doc.edit .blk.can:hover{background:var(--sunk);box-shadow:inset 0 0 0 1px var(--rule)}
.doc.edit .blk.can:hover::after{content:"고치기";position:absolute;top:-.5rem;right:.2rem;
  font-family:var(--mono);font-size:.6rem;color:var(--accent);background:var(--panel);
  border:1px solid var(--accent);border-radius:2px;padding:0 .25rem}
.doc.edit .blk.open{background:var(--panel);box-shadow:inset 0 0 0 2px var(--accent)}
.doc.edit .blk.open::after{display:none}
.ined{padding:.5rem}
/* 읽던 모습 그대로 고치는 자리. 마크다운 기호는 보이지 않는다.
   글 쓰는 자리는 화면에서 가장 밝아야 한다 — 바탕색(회색)을 깔면
   「지금 못 고치는 칸」처럼 보인다 */
.rich{background:var(--panel);border:1px solid var(--rule);border-radius:3px;
  padding:.5rem .6rem;min-height:2.6rem;line-height:1.75}
.rich:focus{outline:2px solid var(--accent);outline-offset:-1px}
.rich>:first-child{margin-top:0}
.rich>:last-child{margin-bottom:0}
.tools{display:flex;flex-wrap:wrap;gap:.25rem;margin-bottom:.4rem;align-items:center}
.tbsep{width:1px;height:.9rem;background:var(--rule);margin:0 .2rem}
.tb{font-family:var(--ui);font-size:.72rem;color:var(--muted);background:var(--panel);
  border:1px solid var(--rule);border-radius:3px;padding:.2rem .45rem;cursor:pointer}
.tb:hover{background:var(--sunk);color:var(--accent);border-color:var(--accent)}
.hint{font-size:.7rem;color:var(--faint);margin-top:.35rem;line-height:1.6}
.hint b{color:var(--muted);font-family:var(--mono);font-weight:500}
.inbar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.5rem}
.inmsg{font-size:.74rem;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.inmsg.bad{color:var(--bad)}
.gridwrap{overflow-x:auto;margin-bottom:.4rem}
table.grid{border-collapse:collapse;width:100%}
table.grid th,table.grid td{border:1px solid var(--rule);padding:0}
table.grid th{background:var(--sunk)}
table.grid input{font-family:var(--ui);font-size:.8rem;color:var(--ink);background:transparent;
  border:0;padding:.3rem .45rem;width:100%;min-width:7rem}
table.grid th input{font-weight:600}
table.grid input:focus{outline:2px solid var(--accent);outline-offset:-2px;
  background:var(--accent-soft)}
table.grid td.rowtool{border:0;width:1.6rem;text-align:center;background:transparent}
table.grid td.rowtool .tb{padding:.1rem .3rem;font-size:.8rem;line-height:1}

/* 잠금 */
.lockbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.55rem;
  padding:.45rem .7rem;border-radius:3px;font-size:.78rem}
.lockbar.mine{background:var(--ok-soft);border-left:3px solid var(--ok);color:var(--ok)}
.lockbar.other{background:var(--warn-soft);border-left:3px solid var(--warn);color:var(--warn)}
.lockbar b{font-family:var(--mono);font-weight:600}
.rec .lk{font-size:.62rem;font-family:var(--mono);color:var(--warn);flex:0 0 auto}
.rec .lk.mine{color:var(--ok)}
.editing .savebar{background:var(--ok-soft);border-color:var(--ok)}
.savebar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;
  background:var(--panel);border:1px solid var(--rule);border-radius:4px;
  padding:.5rem .7rem;margin-top:1.2rem;box-shadow:0 -2px 10px rgb(0 0 0 / .06)}
.msg{font-size:.78rem;min-width:0;overflow-wrap:anywhere}
.msg.ok{color:var(--ok)}
.msg.bad{color:var(--bad)}
.errs{background:var(--bad-soft);border-left:3px solid var(--bad);padding:.55rem .75rem;
  margin-top:.6rem;font-size:.8rem;border-radius:0 2px 2px 0}
.errs ul{margin:.25rem 0 0;padding-left:1.1rem}
.okbox{background:var(--ok-soft);border-left:3px solid var(--ok);padding:.5rem .75rem;
  margin-top:.6rem;font-size:.78rem;border-radius:0 2px 2px 0}
.nav2{display:flex;justify-content:space-between;gap:.5rem;margin-top:1.4rem;
  padding-top:.7rem;border-top:1px solid var(--rule)}
.nav2 .btn{max-width:46%;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

<header class="top">
  <h1>지식시스템 편집기</h1>
  <span class="rootp" id="rootp">연결 중…</span>
  <input id="q" type="search" placeholder="레코드명·본문 검색" autocomplete="off">
  <button class="tg" id="tgq" aria-pressed="false">확인 필요만</button>
  <button class="tg" id="tgw" aria-pressed="false" title="글 폭을 창 끝까지 늘립니다">넓게</button>
  <button class="tg" id="tgr" aria-pressed="false">새로 읽기</button>
  <button class="tg" id="whoBtn" title="편집할 때 다른 사람에게 보이는 이름">이름</button>
  <span id="hits"></span>
</header>

<div class="cols">
  <nav class="tree" id="tree"><div class="empty">읽는 중…</div></nav>
  <main class="view" id="view"><div class="empty">왼쪽에서 레코드를 고르세요.</div></main>
</div>

<script>
const $ = s => document.querySelector(s);

// 서버 한 대에 여러 명이 붙으므로, 편집자 이름은 브라우저가 들고 있다가 요청마다 보낸다.
// 신원 증명이 아니라 "지금 누가 보고 있는지" 를 알리는 이름표다.
let ME = '';
function loadWho(){
  try { ME = localStorage.getItem('ks.who') || ''; } catch(_){ ME = ''; }
  return ME;
}
function saveWho(v){
  ME = (v || '').trim().slice(0, 40);
  try { localStorage.setItem('ks.who', ME); } catch(_){}
  const b = document.querySelector('#whoBtn');
  if (b) b.textContent = ME || '이름 설정';
  return ME;
}
function askWho(force){
  const cur = loadWho();
  if (cur && !force) return cur;
  const v = prompt('편집할 때 다른 사람에게 보일 이름을 적어 주세요.\n예: 노숙진 / 노숙진(DevOps)', cur || '');
  if (v === null) return cur;
  return saveWho(v);
}
const _fetch = window.fetch.bind(window);
window.fetch = (url, opt = {}) => {
  const h = new Headers(opt.headers || {});
  h.set('X-Editor-Who', encodeURIComponent(ME || ''));
  return _fetch(url, {...opt, headers: h});
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TREE = null, FLAT = [], CUR = null, dirty = false;
let onlyQ = false, LOCKS = {};
// 접었는지 펼쳤는지를 기억해 둔다. 트리는 45초마다(남의 편집 표시 때문에)
// 다시 그려지는데, 그때마다 접어 둔 것이 도로 펼쳐지면 안 된다.
// 기본은 다 접어 둔다. 전부 펼치면 134줄이라 02_보유자산(51건)을 지나야
// 03 이 나온다. 접어 두면 여섯 줄이고 건수가 붙어 있어 구조가 한눈에 보인다.
// 접었다 폈다 한 것은 브라우저에 남겨 다음에 들어와도 그대로 둔다.
const CATOPEN = (() => {
  try { return JSON.parse(localStorage.getItem('ks.cats') || '{}'); }
  catch(_){ return {}; }
})();
function saveCats(){
  try { localStorage.setItem('ks.cats', JSON.stringify(CATOPEN)); } catch(_){}
}

function flatten(t){
  const out = [];
  for (const c of t.cats) for (const r of c.records)
    out.push({...r, cat:c.id, key:c.id+'/'+r.name});
  return out;
}
function visible(){
  const s = $('#q').value.trim().toLowerCase();
  return FLAT.filter(r => {
    if (onlyQ && !r.q && !r.tmpl) return false;
    if (s && !r.name.toLowerCase().includes(s)) return false;
    return true;
  });
}

// 찾는 중에는 전부 펼친다 (찾은 것이 접힌 안에 숨으면 안 되니까).
// 그 밖에는 사람이 접었다 폈다 한 대로 따른다.
function catOpen(id, byDefault){
  if (searching()) return true;
  return CATOPEN[id] === undefined ? byDefault : CATOPEN[id];
}
function searching(){ return !!$('#q').value.trim() || onlyQ; }

function buildTree(){
  const vis = visible(), set = new Set(vis.map(r => r.key));
  let h = '';
  if (TREE.claude)
    h += `<div class="cat" data-open="true"><button class="rec" data-key="__claude"${CUR&&CUR.key==='__claude'?' aria-current="true"':''}><span class="nm">CLAUDE.md</span><span class="qn z">규칙</span></button></div>`;
  for (const c of TREE.cats){
    // 양식은 그 카테고리 맨 위에 둔다 — 새 레코드를 만들 때 바로 집어 가도록
    const kids = c.records.filter(r => set.has(c.id+'/'+r.name));
    kids.sort((a, b) => (b.tmpl ? 1 : 0) - (a.tmpl ? 1 : 0));
    h += `<div class="cat" data-cat="${esc(c.id)}" data-open="${catOpen(c.id, false)}"><button class="cathead"><span class="tw">▾</span><span>${esc(c.id)}</span><span class="cn">${kids.length}</span></button><div class="kids">`;
    if (!kids.length) h += `<div class="empty">${c.id==='06_인력'?'레코드 없음':'표시할 레코드 없음'}</div>`;
    h += `<button class="rec addrec" data-add="${esc(c.id)}"><span class="nm">＋ 새 레코드</span></button>`;
    for (const r of kids){
      const cls = 'rec'+(r.ex?' tmpl ex':r.tmpl?' tmpl':'');
      const on = CUR && CUR.key === c.id+'/'+r.name;
      const lk = LOCKS[c.id+'/'+r.name];
      h += `<button class="${cls}" data-key="${esc(c.id+'/'+r.name)}"${on?' aria-current="true"':''}>`
         + `<span class="nm">${esc(r.name)}</span>`
         + (lk ? `<span class="lk${lk.mine?' mine':''}" title="${esc(lk.who)} 편집 중">✎</span>` : '')
         + `<span class="qn${r.q?'':' z'}">${r.q||'✓'}</span></button>`;
    }
    h += `</div></div>`;
  }
  for (const t of TREE.tests){
    const n = t.groups.reduce((a,g)=>a+g.files.length,0);
    h += `<div class="cat" data-cat="${esc(t.name)}" data-open="${catOpen(t.name, false)}"><button class="cathead"><span class="tw">▾</span><span>${esc(t.name)}</span><span class="cn">${n}</span></button><div class="kids">`;
    for (const g of t.groups){
      h += `<div class="empty">${esc(g.name)}</div>`;
      for (const f of g.files) h += `<div class="tfile">${esc(f)}</div>`;
    }
    h += `</div></div>`;
  }
  $('#tree').innerHTML = h;
  $('#hits').textContent = `${vis.length}건`;
}


async function show(key, mode){
  if (dirty && !confirm('저장하지 않은 수정이 있습니다. 버리고 넘어갈까요?')) return;
  if (dirty && CUR && CUR.cat) releaseLock(CUR.cat, CUR.name);
  dirty = false; stopBeat();
  if (key === '__claude'){
    CUR = {key, name:'CLAUDE.md', ro:true, raw:TREE.claude, full:TREE.root + '\\CLAUDE.md'};
    $('#view').innerHTML = `<div class="vhead"><h2>CLAUDE.md</h2>`
      + `<div class="pathrow"><code>${esc(CUR.full)}</code></div>`
      + `<div class="tmplbar">작성 규칙 문서입니다. 편집기에서는 읽기만 합니다.</div></div>`
      + `<div class="doc">${TREE.claudeHtml || ''}</div>`;
    applyWide(); buildTree(); return;
  }
  const [cat, ...rest] = key.split('/');
  const name = rest.join('/');
  // 찾기로 들어왔으면 그 레코드가 접힌 카테고리 안에 있다. 열어 준다
  if (!CATOPEN[cat]){ CATOPEN[cat] = true; saveCats(); }
  const res = await fetch(`/api/record?cat=${encodeURIComponent(cat)}&name=${encodeURIComponent(name)}`);
  const r = await res.json();
  if (r.error){ $('#view').innerHTML = `<div class="errs">${esc(r.error)}</div>`; return; }
  r.key = key; CUR = r;
  render(mode === 'edit');
  buildTree();
  const el = $(`.rec[data-key="${CSS.escape(key)}"]`);
  if (el) el.scrollIntoView({block:'nearest'});
}

function head(r, editing){
  const meta = FLAT.find(x => x.key === r.key) || {};
  let h = `<div class="vhead"><h2>${esc(r.name)}</h2>`
    + `<div class="pathrow"><code id="pv">${esc(r.full)}</code>`
    + `<button class="btn" id="cpy">경로 복사</button>`;
  const lk = r.lock;
  if (!editing){
    if (lk && !lk.mine && !lk.stale)
      h += `<button class="btn" id="edit" disabled>편집 중</button>`;
    else
      h += `<button class="btn go" id="edit">수정하기</button>`;
  }
  h += `</div>`;
  if (meta.subs && meta.subs.length)
    h += `<div class="subs">` + meta.subs.map(s =>
      `<span class="sub${s.n?' has':''}">${esc(s.name)}${s.n?' '+s.n:' 비어 있음'}</span>`).join('') + `</div>`;
  if (lk && !lk.mine && !lk.stale)
    h += `<div class="lockbar other"><b>${esc(lk.who)}</b> 님이 ${mins(lk.age)} 전부터 편집 중입니다.`
       + `<button class="btn" id="steal">잠금 가져오기</button></div>`;
  else if (lk && lk.stale)
    h += `<div class="lockbar other"><b>${esc(lk.who)}</b> 님의 잠금이 ${mins(lk.age)}째 멈춰 있습니다. 가져다 쓸 수 있습니다.</div>`;
  else if (editing)
    h += `<div class="lockbar mine">내가 편집 중입니다. 저장하거나 취소할 때까지 다른 사람은 못 고칩니다.</div>`;
  if (r.name.startsWith('_'))
    h += `<div class="tmplbar">빈 양식입니다. 새 레코드를 만들 때 복사해 쓰세요.</div>`;
  if (r.q) h += `<div class="warnbar"><b>${r.q}</b>곳이 (확인 필요)로 비어 있습니다</div>`;
  return h + `</div>`;
}

function mins(sec){
  if (sec < 60) return '방금';
  const m = Math.round(sec/60);
  return m < 60 ? `${m}분` : `${Math.round(m/60)}시간`;
}

function navRow(key){
  const vis = visible(), i = vis.findIndex(x => x.key === key);
  const pv = i > 0 ? vis[i-1] : null, nx = i >= 0 && i < vis.length-1 ? vis[i+1] : null;
  return `<div class="nav2">`
    + `<button class="btn" ${pv?`data-go="${esc(pv.key)}"`:'disabled'}>← ${pv?esc(pv.name):'처음'}</button>`
    + `<button class="btn" ${nx?`data-go="${esc(nx.key)}"`:'disabled'}>${nx?esc(nx.name):'마지막'} →</button></div>`;
}

// 읽기 화면이 곧 편집 화면이다. 블록을 눌러 그 자리에서 고치고,
// 저장하면 그 블록의 줄만 갈아 끼운다. 나머지는 손대지 않는다.
const EDITABLE = {list:'목록', para:'문단', table:'표'};

function render(editing){
  const r = CUR;
  let h = head(r, editing);
  h += `<div class="doc${editing ? ' edit' : ''}" id="doc">${r.html || ''}</div>`;
  if (editing)
    h += `<div class="savebar"><button class="btn" id="done">편집 끝내기</button>`
      + (r.name && r.name.startsWith('_') ? ''      // 양식은 지우지 못하게
         : `<button class="btn del" id="del" title="_지운것 폴더로 옮깁니다">레코드 지우기</button>`)
      + `<span class="msg" id="msg">고칠 곳을 누르세요. 표는 칸으로, 글은 글상자로 열립니다.</span></div>`;
  h += navRow(r.key);
  $('#view').innerHTML = h;
  $('#view').scrollTop = 0;
  applyWide();

  $('#cpy').onclick = async () => {
    try { await navigator.clipboard.writeText(r.full); $('#cpy').textContent = '복사됨'; }
    catch { $('#cpy').textContent = '복사 실패'; }
    setTimeout(() => $('#cpy').textContent = '경로 복사', 1500);
  };
  const eb = $('#edit'); if (eb && !eb.disabled) eb.onclick = () => startEdit(false);
  const sb = $('#steal'); if (sb) sb.onclick = () => {
    if (confirm('다른 사람이 편집 중입니다. 잠금을 가져오면 그쪽은 저장하지 못합니다. 가져올까요?'))
      startEdit(true);
  };
  if (editing){
    $('#doc').querySelectorAll('.blk').forEach(b => {
      const k = b.dataset.kind;
      if (!EDITABLE[k]) return;
      b.classList.add('can');
      b.title = EDITABLE[k] + ' 고치기';
      b.addEventListener('click', e => {
        // 편집 상자 안에서 난 클릭은 여기까지 올라와도 무시한다.
        // 「취소」가 상자를 닫는 순간 이 클릭이 그대로 올라와 다시 열어 버린다.
        if (e.target.closest('.ined')) return;
        if (b.querySelector('.ined')) return;      // 이미 열려 있다
        if (e.target.closest('a')) return;
        openBlock(b);
      });
    });
    $('#done').onclick = async () => {
      if (dirty && !confirm('고치던 것이 있습니다. 버리고 끝낼까요?')) return;
      dirty = false; stopBeat();
      await releaseLock(r.cat, r.name);
      await show(r.key);
    };
    const db = $('#del'); if (db) db.onclick = () => delRecord();
  }
  $('#view').querySelectorAll('[data-go]').forEach(b =>
    b.addEventListener('click', () => show(b.dataset.go)));
}

function srcLines(lo, hi){
  return (CUR.raw || '').split('\n').slice(lo, hi + 1);
}

function openBlock(b){
  // 한 번에 한 군데만 연다. 여러 군데를 열어 두면 「어디를 고치고 있었지」가
  // 헷갈리고, 한쪽을 취소할 때 다른 쪽의 안 저장된 수정이 조용히 날아간다.
  const open = $('.blk.open');
  if (open){
    if (open === b) return;
    if (!closeBlock(open)) return;        // 고치던 게 있어 되돌아간 경우
  }
  const lo = +b.dataset.lo, hi = +b.dataset.hi, kind = b.dataset.kind;
  const raw = srcLines(lo, hi);
  b.dataset.keep = b.innerHTML;
  const ed = document.createElement('div');
  ed.className = 'ined';
  ed.innerHTML = (kind === 'table' ? gridHtml(raw) : proseHtml(raw, b.dataset.keep))
    + `<div class="inbar"><button class="btn go sv">저장</button>`
    + `<button class="btn cx">취소</button><span class="inmsg"></span></div>`;
  b.innerHTML = '';
  b.appendChild(ed);
  b.classList.add('open');

  if (kind === 'table') wireGrid(ed);
  else wireRich(ed);
  ed.querySelector('.cx').onclick = () => closeBlock(b);
  ed.querySelector('.sv').onclick = () => saveBlock(b, kind, ed);
}

// 그 블록 하나만 되돌린다. 편집 모드와 잠금은 그대로 둔다.
// 고치던 글이 있으면 한 번 묻는다 — 물러나면 false 를 돌려준다.
function closeBlock(b, force){
  if (!force && dirty
      && !confirm('이 자리에서 고치던 것이 있습니다. 버리고 원래 글로 되돌릴까요?'))
    return false;
  if (b.dataset.keep !== undefined){ b.innerHTML = b.dataset.keep; delete b.dataset.keep; }
  b.classList.remove('open');
  dirty = false;
  return true;
}

// ── 글 — 렌더된 모습 그대로 고친다. 마크다운 기호는 보이지 않는다 ──
function proseHtml(raw, rendered){
  return `<div class="tools">`
    + `<button class="tb" data-cmd="bold" title="굵게 (Ctrl+B)"><b>가</b></button>`
    + `<button class="tb" data-cmd="code" title="코드·파일명">코드</button>`
    + `<button class="tb" data-cmd="note" title="확인 필요 표시">(확인 필요)</button>`
    + `<span class="tbsep"></span>`
    + `<button class="tb" data-cmd="indent" title="한 단 들이기 (Tab)">→ 들이기</button>`
    + `<button class="tb" data-cmd="outdent" title="한 단 내기 (Shift+Tab)">← 내기</button>`
    + `</div><div class="rich" contenteditable="true" spellcheck="false">${rendered}</div>`
    + `<div class="hint">엔터로 새 항목 · Tab 으로 들이기 · 항목 안에서 <b>Shift+엔터</b> 면 설명 줄</div>`;
}

function wireRich(ed){
  const rich = ed.querySelector('.rich');
  rich.focus();
  rich.addEventListener('input', () => { dirty = true; });

  rich.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b'){
      e.preventDefault(); cmd(rich, 'bold'); return;
    }
    if (e.key === 'Tab'){
      e.preventDefault(); cmd(rich, e.shiftKey ? 'outdent' : 'indent'); return;
    }
    if (e.key === 'Enter' && e.shiftKey){
      // 항목 아래 설명 줄
      e.preventDefault();
      const li = selEl(rich, 'li');
      if (li){
        const d = document.createElement('div');
        d.className = 'sub'; d.textContent = '​';
        li.appendChild(d);
        place(d);
        dirty = true;
      } else document.execCommand('insertLineBreak');
      return;
    }
  });

  ed.querySelectorAll('[data-cmd]').forEach(b =>
    b.addEventListener('mousedown', e => {
      e.preventDefault();          // 선택이 풀리지 않게
      cmd(rich, b.dataset.cmd); dirty = true;
    }));
}

function selEl(root, tag){
  let n = getSelection().anchorNode;
  while (n && n !== root){
    if (n.nodeType === 1 && n.tagName.toLowerCase() === tag) return n;
    n = n.parentNode;
  }
  return null;
}

// 커서 자리에 넣는다. 커서가 글상자 밖이면 맨 끝에 붙인다
function putAtCaret(rich, el){
  const s = getSelection();
  let r = null;
  if (s && s.rangeCount){
    const t = s.getRangeAt(0);
    if (rich.contains(t.commonAncestorContainer)) r = t;
  }
  if (r){ r.deleteContents(); r.insertNode(el); }
  else rich.appendChild(el);
  placeAfter(el);
}

// 넣은 것 바로 뒤에 커서를 둔다. 안에 두면 이어 치는 글자가 같이 물든다
function placeAfter(el){
  const r = document.createRange();
  r.setStartAfter(el); r.collapse(true);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

function place(el){
  const r = document.createRange();
  r.selectNodeContents(el); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

function cmd(rich, what){
  rich.focus();
  if (what === 'bold') document.execCommand('bold');
  else if (what === 'indent') document.execCommand('indent');
  else if (what === 'outdent') document.execCommand('outdent');
  else if (what === 'code'){
    const s = getSelection();
    const t = s.toString();
    if (!t) return;
    const c = document.createElement('code');
    c.textContent = t;
    s.getRangeAt(0).deleteContents();
    s.getRangeAt(0).insertNode(c);
    placeAfter(c);
  } else if (what === 'note'){
    // execCommand('insertText') 는 자리에 따라 그냥 아무 일도 안 한다. 직접 끼운다
    const n = document.createElement('span');
    n.className = 'q'; n.textContent = '(확인 필요)';
    putAtCaret(rich, n);
  }
}

// ── 화면(HTML) → 마크다운 ──
// 손대지 않은 자리는 원래 글자 그대로 돌아와야 한다. 그래서 글머리 기호(`-`·`•`·`·`)와
// 들여쓴 칸 수를 화면 요소에 적어 두고(data-mk·data-ind), 되돌릴 때 그것을 쓴다.

function inlineMd(node, skipBlocks){
  let out = '';
  node.childNodes.forEach(n => {
    if (n.nodeType === 3){ out += n.nodeValue.replace(/​/g, ''); return; }
    if (n.nodeType !== 1) return;
    const t = n.tagName.toLowerCase();
    if (t === 'br'){ out += ' '; return; }
    if (skipBlocks && (t === 'ul' || t === 'ol'
        || (t === 'div' && n.classList.contains('sub')))) return;
    const inner = inlineMd(n, skipBlocks);
    if (!inner.trim()){ out += inner; return; }
    // `** 가 **` 처럼 기호 안에 공백이 들어가면 굵게가 먹지 않는다. 밖으로 민다
    const g = inner.match(/^(\s*)([\s\S]*?)(\s*)$/);
    if (t === 'strong' || t === 'b') out += g[1] + '**' + g[2] + '**' + g[3];
    else if (t === 'em' || t === 'i') out += g[1] + '*' + g[2] + '*' + g[3];
    else if (t === 'code') out += g[1] + (n.classList.contains('wiki')
      ? '[[' + g[2] + ']]' : '`' + g[2] + '`') + g[3];
    else out += inner;                       // span.q·font·style 따위는 글자 그대로
  });
  return out;
}

function oneLine(node, skipBlocks){
  return inlineMd(node, skipBlocks).replace(/\s+/g, ' ').trim();
}

// 새로 만든 항목에는 표시가 없다. 같은 묶음의 형제에게서 물려받는다.
function liInd(li, fallback){
  if (li.dataset.ind !== undefined) return +li.dataset.ind;
  const sibs = [...li.parentNode.children]
    .filter(x => x.tagName === 'LI' && x.dataset.ind !== undefined);
  return sibs.length ? +sibs[0].dataset.ind : fallback;
}
function liMk(li){
  if (li.dataset.mk) return li.dataset.mk;
  const sib = [...li.parentNode.children].find(x => x.tagName === 'LI' && x.dataset.mk);
  return sib ? sib.dataset.mk : '-';
}

function liMd(li, fallbackInd, out){
  const ind = liInd(li, fallbackInd);
  const pad = ' '.repeat(ind);
  const head = oneLine(li, true);
  // 항목 사이를 띄워 둔 레코드가 있다. 그 빈 줄도 원래대로 돌려 놓는다
  if (head && li.dataset.gap && out.length) out.push('');
  if (head) out.push(pad + liMk(li) + ' ' + head);
  li.childNodes.forEach(n => {
    if (n.nodeType !== 1) return;
    const t = n.tagName.toLowerCase();
    if (t === 'div' && n.classList.contains('sub')){
      const s = oneLine(n, true);
      if (s) out.push(' '.repeat(n.dataset.ind !== undefined ? +n.dataset.ind : ind + 2) + s);
    } else if (t === 'ul' || t === 'ol'){
      const sub = (u, d) => [...u.children].forEach(c => {
        if (c.tagName === 'LI') liMd(c, d, out);
        else if (c.tagName === 'UL' || c.tagName === 'OL') sub(c, d + 2);
      });
      sub(n, ind + 2);
    }
  });
}

function domToMd(root){
  const out = [];
  // 중첩 목록은 바깥 ul 의 형제로 들어오기도 하고 li 안에 들어오기도 한다. 둘 다 받는다
  const walkList = (ul, ind) => {
    [...ul.children].forEach(c => {
      if (c.tagName === 'LI') liMd(c, ind, out);
      else if (c.tagName === 'UL' || c.tagName === 'OL') walkList(c, ind + 2);
    });
  };
  const walk = (node, fallbackInd) => {
    node.childNodes.forEach(n => {
      if (n.nodeType === 3){
        const t = n.nodeValue.replace(/​/g, '').trim();
        if (t) out.push(t);
        return;
      }
      if (n.nodeType !== 1) return;
      const tag = n.tagName.toLowerCase();
      if (tag === 'li'){
        liMd(n, fallbackInd, out);
      } else if (tag === 'ul' || tag === 'ol'){
        walkList(n, fallbackInd);
      } else if (tag === 'br'){
        // 무시
      } else if (n.querySelector && n.querySelector('ul,ol,p,li')){
        walk(n, fallbackInd);                 // 안에 블록이 있으면 더 들어간다
      } else {
        const t = oneLine(n, false);
        // 문단은 여러 줄이어도 한 줄로 합친다. 들여쓴 칸은 원래대로 둔다
        if (t) out.push(' '.repeat(n.dataset && n.dataset.ind !== undefined
                                   ? +n.dataset.ind : 0) + t);
      }
    });
  };
  walk(root, 0);
  return out.join('\n');
}

// ── 표 ──
function parseTable(raw){
  const rows = raw.filter(l => l.trim().startsWith('|'))
    .filter(l => !/^\|[\s:|-]+\|$/.test(l.trim()))
    .map(l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim()));
  const n = Math.max(...rows.map(r => r.length));
  return rows.map(r => { while (r.length < n) r.push(''); return r; });
}

function gridHtml(raw){
  const g = parseTable(raw);
  let h = `<div class="gridwrap"><table class="grid"><tbody>`;
  g.forEach((row, ri) => {
    h += `<tr>`;
    row.forEach((c, ci) => {
      h += ri === 0
        ? `<th><input value="${esc(c)}" data-r="0" data-c="${ci}"></th>`
        : `<td><input value="${esc(c)}" data-r="${ri}" data-c="${ci}"></td>`;
    });
    h += `<td class="rowtool">` + (ri === 0 ? '' :
      `<button class="tb delr" data-r="${ri}" title="이 행 지우기">−</button>`) + `</td></tr>`;
  });
  h += `</tbody></table></div>`
    + `<div class="tools"><button class="tb addr">행 추가</button>`
    + `<button class="tb addc">열 추가</button>`
    + `<button class="tb delc">마지막 열 지우기</button></div>`
    + `<div class="hint">첫 줄이 표의 머리글입니다. 칸 안에 <b>|</b> 와 줄바꿈은 넣을 수 없습니다.</div>`;
  return h;
}

function gridRead(ed){
  const rows = [];
  ed.querySelectorAll('.grid tbody tr').forEach(tr => {
    const r = [];
    tr.querySelectorAll('input').forEach(i => r.push(i.value.trim()));
    rows.push(r);
  });
  return rows;
}

function gridToMd(rows){
  if (!rows.length) return '';
  const n = rows[0].length;
  const out = ['| ' + rows[0].join(' | ') + ' |', '|' + '---|'.repeat(n)];
  rows.slice(1).forEach(r => {
    const c = r.slice(0, n); while (c.length < n) c.push('');
    out.push('| ' + c.join(' | ') + ' |');
  });
  return out.join('\n');
}

function wireGrid(ed){
  const redraw = rows => {
    const w = ed.querySelector('.gridwrap').parentElement;
    const bar = ed.querySelector('.inbar');
    const tmp = document.createElement('div');
    tmp.innerHTML = gridHtml(gridToMd(rows).split('\n'));
    ed.querySelector('.gridwrap').replaceWith(tmp.querySelector('.gridwrap'));
    ed.querySelector('.tools').replaceWith(tmp.querySelector('.tools'));
    ed.querySelector('.hint').replaceWith(tmp.querySelector('.hint'));
    wireGrid(ed); dirty = true;
  };
  ed.querySelectorAll('.grid input').forEach(i =>
    i.addEventListener('input', () => { dirty = true; }));
  ed.querySelector('.addr').onclick = () => {
    const rows = gridRead(ed); rows.push(new Array(rows[0].length).fill('')); redraw(rows); };
  ed.querySelector('.addc').onclick = () => {
    const rows = gridRead(ed); rows.forEach(r => r.push('')); redraw(rows); };
  ed.querySelector('.delc').onclick = () => {
    const rows = gridRead(ed);
    if (rows[0].length <= 1) return;
    rows.forEach(r => r.pop()); redraw(rows); };
  ed.querySelectorAll('.delr').forEach(b => b.onclick = () => {
    const rows = gridRead(ed);
    if (rows.length <= 2) { alert('머리글과 한 줄은 남아야 합니다.'); return; }
    rows.splice(+b.dataset.r, 1); redraw(rows); });
}

// ── 저장 ──
async function saveBlock(b, kind, ed){
  const msg = ed.querySelector('.inmsg');
  const sv = ed.querySelector('.sv');
  let text = kind === 'table' ? gridToMd(gridRead(ed))
                              : domToMd(ed.querySelector('.rich'));
  if (kind === 'para'){
    // 문단은 손으로 줄을 접어 둔 것뿐이라 고치면 한 줄로 합쳐진다.
    // 글자가 그대로면 합치지 않고 원문을 그대로 둔다.
    const src = srcLines(+b.dataset.lo, +b.dataset.hi).filter(x => x.trim()).join('\n');
    const flat = s => s.replace(/\s+/g, ' ').trim();
    if (flat(text) === flat(src)) text = src;
  }
  sv.disabled = true; msg.textContent = '저장 중…'; msg.className = 'inmsg';
  const j = await post('/api/block', {cat:CUR.cat, name:CUR.name, who:ME,
    lo:+b.dataset.lo, hi:+b.dataset.hi, text, mtime:CUR.mtime});
  if (j.ok){
    dirty = false;
    // 줄 번호가 밀렸으니 레코드를 다시 읽어 통째로 그린다
    const fresh = await (await fetch(`/api/record?cat=${encodeURIComponent(CUR.cat)}`
      + `&name=${encodeURIComponent(CUR.name)}`)).json();
    fresh.key = CUR.key; CUR = fresh;
    render(true);
    const m = $('#msg');
    if (m){ m.textContent = '저장했습니다 — K드라이브에 반영됐습니다. 백업 ' + j.backup;
            m.className = 'msg ok'; }
    await refresh();
  } else {
    sv.disabled = false;
    msg.textContent = (j.errors || ['저장하지 못했습니다'])[0];
    msg.className = 'inmsg bad';
  }
}

let beatTimer = null;
function stopBeat(){ if (beatTimer){ clearInterval(beatTimer); beatTimer = null; } }

async function post(path, body){
  return (await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
                             body: JSON.stringify(body)})).json();
}
async function releaseLock(cat, name){
  try { await post('/api/unlock', {cat, name}); } catch(_){}
}

async function startEdit(steal){
  if (!askWho(false)){
    alert('이름을 적어야 편집할 수 있습니다. 다른 사람이 누가 보고 있는지 알아야 하니까요.');
    return;
  }
  const r = CUR;
  const res = await post('/api/lock', {cat:r.cat, name:r.name, steal: !!steal});
  if (!res.ok){
    r.lock = res.lock; render(false);
    alert(`${res.lock.who} 님이 편집 중이라 지금은 고칠 수 없습니다.`);
    return;
  }
  // 잠근 뒤 최신 내용으로 다시 읽는다 — 그 사이 누가 고쳤을 수 있다
  const fresh = await (await fetch(`/api/record?cat=${encodeURIComponent(r.cat)}`
    + `&name=${encodeURIComponent(r.name)}`)).json();
  fresh.key = r.key; CUR = fresh;
  render(true);
  stopBeat();
  beatTimer = setInterval(() => post('/api/beat', {cat:r.cat, name:r.name}), 60000);
}

async function refresh(force){
  TREE = await (await fetch('/api/tree' + (force ? '?force=1' : ''))).json();
  try { LOCKS = (await (await fetch('/api/locks')).json()).locks || {}; } catch(_){ LOCKS = {}; }
  FLAT = flatten(TREE);
  $('#rootp').textContent = TREE.root;
  buildTree();
  // 들어오자마자 아무것도 펼치지 않는다. CLAUDE.md 는 쓰는 사람이 고칠 수 없는
  // 작성 규칙 문서라, 첫 화면에 띄워 두면 그것부터 읽으라는 말처럼 보인다.
}

$('#tree').addEventListener('click', e => {
  const ch = e.target.closest('.cathead');
  if (ch){
    const c = ch.parentElement;
    const now = c.dataset.open !== 'true';
    c.dataset.open = String(now);
    if (c.dataset.cat){ CATOPEN[c.dataset.cat] = now; saveCats(); }
    return;
  }
  const ab = e.target.closest('[data-add]');
  if (ab){ addRecord(ab.dataset.add); return; }
  const rb = e.target.closest('.rec');
  if (rb) show(rb.dataset.key);
});

// ── 레코드 만들기·지우기 ──
async function addRecord(cat){
  if (!askWho(false)){
    alert('이름을 적어야 레코드를 만들 수 있습니다.');
    return;
  }
  const name = (prompt(`${cat} 에 만들 레코드 이름을 적으세요.\n`
    + `파일 이름이 되니 \\ / : * ? " < > | 는 쓸 수 없습니다.`) || '').trim();
  if (!name) return;
  const j = await post('/api/new', {cat, name});
  if (!j.ok){ alert((j.errors || ['만들지 못했습니다'])[0]); return; }
  await refresh(true);
  await show(cat + '/' + name);
  // 만들자마자 채우러 들어가는 게 자연스럽다 — 잠금도 같이 잡힌다
  await startEdit(false);
  const m = $('#msg');
  if (m){ m.textContent = `만들었습니다 — ${j.path} · 노란 곳을 채우세요.`; m.className = 'msg ok'; }
}

async function delRecord(){
  const r = CUR;
  if (!r || !r.cat) return;
  if (!confirm(`「${r.name}」 레코드를 지울까요?\n\n`
    + `바로 지우지 않고 지식시스템의 _지운것 폴더로 옮깁니다. 거기서 되돌릴 수 있습니다.`))
    return;
  const j = await post('/api/del', {cat: r.cat, name: r.name});
  if (!j.ok){ alert((j.errors || ['지우지 못했습니다'])[0]); return; }
  dirty = false; stopBeat();
  CUR = null;
  await refresh(true);
  $('#view').innerHTML = `<div class="empty">「${esc(j.name)}」 을 지웠습니다.<br>`
    + `되돌리려면 지식시스템의 <code>${esc(j.trash)}</code> 를 제자리로 옮기고 「새로 읽기」를 누르세요.</div>`;
}

let tmr;
$('#q').addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(buildTree, 140); });
const tog = (id, get, set) => $(id).addEventListener('click', () => {
  set(!get()); $(id).setAttribute('aria-pressed', String(get())); buildTree(); });
tog('#tgq', () => onlyQ, v => onlyQ = v);

// 글 폭 풀기. 표가 아주 넓은 레코드나 큰 모니터를 쓸 때 쓴다 (노션의 full width)
let WIDE = false;
try { WIDE = localStorage.getItem('ks.wide') === '1'; } catch(_){}
function applyWide(){
  $('#tgw').setAttribute('aria-pressed', String(WIDE));
  const d = $('#doc') || document.querySelector('.doc');
  if (d) d.classList.toggle('wide', WIDE);
}
$('#tgw').addEventListener('click', () => {
  WIDE = !WIDE;
  try { localStorage.setItem('ks.wide', WIDE ? '1' : '0'); } catch(_){}
  applyWide();
});
$('#whoBtn').addEventListener('click', async () => { askWho(true); await refresh(); if (CUR && CUR.cat) show(CUR.key); });
$('#tgr').addEventListener('click', async () => {
  const b = $('#tgr'); b.disabled = true; b.textContent = '읽는 중…';
  try {
    await refresh(true);
    if (CUR && CUR.key !== '__claude') { dirty = false; await show(CUR.key); }
  } finally { b.disabled = false; b.textContent = '새로 읽기'; }
});
addEventListener('beforeunload', e => {
  if (CUR && CUR.cat && beatTimer){
    try { navigator.sendBeacon('/api/unlock',
      new Blob([JSON.stringify({cat:CUR.cat, name:CUR.name})], {type:'application/json'})); } catch(_){}
  }
  if (dirty){ e.preventDefault(); e.returnValue = ''; }
});
// 다른 사람의 편집 상태를 주기적으로 가져와 트리에 표시
let VER = null;
setInterval(async () => {
  try {
    const d = await (await fetch('/api/locks')).json();
    LOCKS = d.locks || {}; buildTree();
    // 서버가 새 코드로 올라갔으면 화면도 알아서 따라간다.
    // 고치던 중이면 건드리지 않는다 — 다음 차례에 다시 본다.
    if (d.ver){
      if (VER && d.ver !== VER && !dirty && !beatTimer) location.reload();
      VER = d.ver;
    }
  } catch(_){}
}, 45000);
addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key === 's'){
    e.preventDefault();
    const b = document.querySelector('.blk.open .sv');
    if (b && !b.disabled) b.click();
  }
  if (e.key === 'Escape'){
    const o = document.querySelector('.blk.open');
    if (o) closeBlock(o);
  }
});
loadWho();
applyWide();
$('#whoBtn').textContent = ME || '이름 설정';
refresh().catch(e => {
  $('#tree').innerHTML = `<div class="empty">읽기 실패</div>`;
  $('#view').innerHTML = `<div class="errs"><strong>지식시스템을 읽지 못했습니다</strong>`
    + `<ul><li>${esc(e && e.message || e)}</li></ul>`
    + `<p>서버 창에 오류가 찍혔는지 보고, K드라이브가 연결돼 있는지 확인하세요.</p></div>`;
});
</script>
